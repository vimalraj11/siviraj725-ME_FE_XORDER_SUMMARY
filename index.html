<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>

  <link rel="icon" type="image/png" href="images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="main">
    <div class="container">

      <div class="hero-image">
        <img src="images/illustration-hero.svg" alt="Person enjoying music">
      </div>

      <div class="content">
        <h1 class="heading">Order Summary</h1>

        <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

        <div class="plan">
          <img class="music-icon" src="images/icon-music.svg" alt="">

          <div class="plan-text">
            <h3>Annual Plan</h3>
            <p>$59.99/year</p>
          </div>

          <div class="change-link">
            <a href="#">Change</a>
          </div>
        </div>

        <button class="proceed-btn" type="button">Proceed to Payment</button>

        <a href="#" class="cancel-order">Cancel Order</a>
      </div>

    </div>
  </main>

</body>
</html>
